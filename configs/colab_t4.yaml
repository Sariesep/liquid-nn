# MiniLiquidGPT v0.3.5 — Colab T4 optimize
# Ücretsiz Colab'da güvenli çalışır, checkpoint'ler Drive'a yazılır

model:
  vocab_size: 50257
  embed_dim: 256
  num_fast: 2
  num_deep: 2
  fast_steps: 1
  deep_steps: 3
  dropout: 0.1
  max_seq: 512
  # ── Attention ──
  use_attention: true
  attn_heads: 4
  attn_window: 64
  use_rope: true
  use_flash: true
  # ── FFN (v0.3.5) ──
  use_ffn: true
  ffn_mult: 4.0
  # ── Biyolojik plastisite (v0.3.4) ──
  use_neuromod: true
  use_homeostasis: true
  homeostasis_target: 0.5
  use_dual_hebb: true
  use_consolidation: true
  consolidation_strength: 1.0
  # ── Diğer ──
  use_rmsnorm: true
  tau_gate: true

training:
  epochs: 10
  batch_size: 8
  lr: 1.0e-3
  chunk_size: 16
  grad_clip: 1.0
  weight_decay: 1.0e-4
  plast_lr_mult: 3.0
  phase_split: 0.5

data:
  max_tokens: 200000
  seq_len: 128

save:
  dir: /content/drive/MyDrive/LiquidGPT_Models/
  save_every: 2
